<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Изменить товар</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<th:block th:if="${employee != null && product != null}">
  <div class="container">
    <header>
      <h1>Изменить товар</h1>
      <div class="user-info">
        <span th:text="${employee.name}"></span>
        <a href="/admin/products" class="back-btn">← Назад</a>
      </div>
    </header>

    <div class="form-container">
      <form th:action="@{/admin/products/edit/{id}(id=${product.id})}" method="post">
        <div class="form-group">
          <label>Название товара:</label>
          <input type="text" name="name" th:value="${product.name}" required>
        </div>

        <div class="form-group">
          <label>Категория:</label>
          <select name="categoryId" required>
            <option th:each="cat : ${categories}"
                    th:value="${cat.id}"
                    th:text="${cat.name}"
                    th:selected="${cat.id == product.categoryId}"></option>
          </select>
        </div>

        <div class="form-group">
          <label>Единица измерения:</label>
          <select name="unit" required>
            <option value="шт" th:selected="${product.unit == 'шт'}">шт</option>
            <option value="кг" th:selected="${product.unit == 'кг'}">кг</option>
            <option value="л" th:selected="${product.unit == 'л'}">л</option>
            <option value="уп" th:selected="${product.unit == 'уп'}">уп</option>
          </select>
        </div>

        <div class="form-group">
          <label>Цена (руб.):</label>
          <input type="number" name="price" th:value="${product.price}"
                 min="0.01" step="0.01" required>
        </div>

        <button type="submit" class="btn-primary">Сохранить</button>
      </form>
    </div>
  </div>
</th:block>
</body>
</html>
