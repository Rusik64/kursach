<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Добавить скидку</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<th:block th:if="${employee != null}">
    <div class="container">
        <header>
            <h1>Добавить скидку</h1>
            <div class="user-info">
                <span th:text="${employee.name}"></span>
                <a href="/discounts" class="back-btn">← Назад</a>
            </div>
        </header>

        <div class="form-container">
            <form th:action="@{/discounts/create}" method="post">
                <div class="form-group">
                    <label>Тип скидки:</label>
                    <div class="radio-group">
                        <label class="radio-label">
                            <input type="radio" name="discountType" value="product"
                                   checked onchange="toggleFields('product')">
                            На конкретный товар
                        </label>
                        <label class="radio-label">
                            <input type="radio" name="discountType" value="category"
                                   onchange="toggleFields('category')">
                            На категорию товаров
                        </label>
                    </div>
                </div>

                <div class="form-group" id="productField">
                    <label>Товар:</label>
                    <select name="productId">
                        <option value="">Выберите товар</option>
                        <option th:each="product : ${products}"
                                th:value="${product.id}"
                                th:text="${product.name} + ' (' + ${product.price} + ' руб.)'"></option>
                    </select>
                </div>

                <div class="form-group" id="categoryField" style="display: none;">
                    <label>Категория:</label>
                    <select name="categoryId">
                        <option value="">Выберите категорию</option>
                        <option th:each="category : ${categories}"
                                th:value="${category.id}"
                                th:text="${category.name}"></option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Процент скидки:</label>
                    <input type="number" name="percentage" min="0.1" max="99.9" step="0.1"
                           required placeholder="10">
                    <small>От 0.1% до 99.9%</small>
                </div>

                <div class="form-group">
                    <label>Дата начала действия:</label>
                    <input type="datetime-local" name="startDate" required>
                </div>

                <div class="form-group">
                    <label>Дата окончания действия:</label>
                    <input type="datetime-local" name="endDate" required>
                </div>

                <button type="submit" class="btn-primary">Добавить скидку</button>
            </form>
        </div>
    </div>
</th:block>

<script>
    function toggleFields(type) {
        const productField = document.getElementById('productField');
        const categoryField = document.getElementById('categoryField');
        const productSelect = document.querySelector('[name="productId"]');
        const categorySelect = document.querySelector('[name="categoryId"]');

        if (type === 'product') {
            productField.style.display = 'block';
            categoryField.style.display = 'none';
            productSelect.required = true;
            categorySelect.required = false;
        } else {
            productField.style.display = 'none';
            categoryField.style.display = 'block';
            productSelect.required = false;
            categorySelect.required = true;
        }
    }
</script>
</body>
</html>
