<!-- templates/edit-employee.html -->
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Изменить сотрудника</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<th:block th:if="${employee != null && editEmployee != null}">
  <div class="container">
    <header>
      <h1>Изменить сотрудника #<span th:text="${editEmployee.id}"></span></h1>
      <div class="user-info">
        <span th:text="${employee.name}"></span>
        <a href="/employees" class="back-btn">← Назад</a>
      </div>
    </header>

    <div class="form-container">
      <form th:action="@{/employees/edit/{id}(id=${editEmployee.id})}" method="post">
        <div class="form-group">
          <label>Имя сотрудника:</label>
          <input type="text" name="name" th:value="${editEmployee.name}" required>
        </div>

        <div class="form-group">
          <label>Магазин:</label>
          <select name="shopId" required>
            <option value="1" th:selected="${editEmployee.shopId == 1}">Магазин #1 - ул. Ленина, 15</option>
            <option value="2" th:selected="${editEmployee.shopId == 2}">Магазин #2 - пр. Мира, 42</option>
          </select>
        </div>

        <div class="form-group">
          <label>Логин:</label>
          <input type="text" name="login" th:value="${editEmployee.login}" required>
        </div>

        <div class="form-group">
          <label>Новый пароль (оставьте пустым, чтобы не менять):</label>
          <input type="password" name="password" placeholder="Введите новый пароль">
          <small>Если не хотите менять пароль, оставьте поле пустым</small>
        </div>

        <div class="form-group">
          <label>Роль:</label>
          <select name="role" required>
            <option value="CASHIER" th:selected="${editEmployee.role == 'CASHIER'}">Кассир</option>
            <option value="MANAGER" th:selected="${editEmployee.role == 'MANAGER'}">Менеджер</option>
            <option value="ADMIN" th:selected="${editEmployee.role == 'ADMIN'}">Администратор</option>
          </select>
        </div>

        <button type="submit" class="btn-primary">Сохранить изменения</button>
      </form>
    </div>
  </div>
</th:block>
</body>
</html>
