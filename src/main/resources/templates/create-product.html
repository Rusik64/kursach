<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Добавить товар</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<th:block th:if="${employee != null}">
  <div class="container">
    <header>
      <h1>Добавить товар</h1>
      <div class="user-info">
        <span th:text="${employee.name}"></span>
        <a href="/admin/products" class="back-btn">← Назад</a>
      </div>
    </header>

    <div class="form-container">
      <form th:action="@{/admin/products/create}" method="post">
        <div class="form-group">
          <label>Название товара:</label>
          <input type="text" name="name" required placeholder="Молоко 3.2%">
        </div>

        <div class="form-group">
          <label>Категория:</label>
          <select name="categoryId" required>
            <option value="">Выберите категорию</option>
            <option th:each="cat : ${categories}"
                    th:value="${cat.id}"
                    th:text="${cat.name}"></option>
          </select>
        </div>

        <div class="form-group">
          <label>Единица измерения:</label>
          <select name="unit" required>
            <option value="шт">шт (штуки)</option>
            <option value="кг">кг (килограммы)</option>
            <option value="л">л (литры)</option>
            <option value="уп">уп (упаковка)</option>
            <option value="г">г (граммы)</option>
            <option value="мл">мл (миллилитры)</option>
          </select>
        </div>

        <div class="form-group">
          <label>Цена (руб.):</label>
          <input type="number" name="price" min="0.01" step="0.01" required placeholder="89.90">
        </div>

        <button type="submit" class="btn-primary">Добавить товар</button>
      </form>
    </div>
  </div>
</th:block>
</body>
</html>
