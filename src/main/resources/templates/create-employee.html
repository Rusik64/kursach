<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Добавить сотрудника</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<th:block th:if="${employee != null}">
    <div class="container">
        <header>
            <h1>Добавить сотрудника</h1>
            <div class="user-info">
                <span th:text="${employee.name}"></span>
                <a href="/employees" class="back-btn">← Назад</a>
            </div>
        </header>

        <div class="form-container">
            <form th:action="@{/employees/create}" method="post" class="employee-form">
                <div class="form-group">
                    <label>Имя сотрудника:</label>
                    <input type="text" name="name" required placeholder="Иванов Иван">
                </div>

                <div class="form-group">
                    <label>Магазин:</label>
                    <select name="shopId" required>
                        <option value="1">Магазин #1 - ул. Ленина, 15</option>
                        <option value="2">Магазин #2 - пр. Мира, 42</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Логин:</label>
                    <input type="text" name="login" required placeholder="ivanov">
                </div>

                <div class="form-group">
                    <label>Пароль:</label>
                    <input type="password" name="password" required placeholder="******">
                </div>

                <div class="form-group">
                    <label>Роль:</label>
                    <select name="role" required>
                        <option value="CASHIER">Кассир</option>
                        <option value="MANAGER">Менеджер</option>
                        <option value="ADMIN">Администратор</option>
                    </select>
                </div>

                <button type="submit" class="btn-primary">Добавить сотрудника</button>
            </form>
        </div>
    </div>
</th:block>
</body>
</html>
