<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Управление товарами</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<th:block th:if="${employee != null}">
  <div class="container">
    <header>
      <h1>Управление товарами</h1>
      <div class="user-info">
        <span th:text="${employee.name}"></span>
        <a href="/" class="back-btn">На главную</a>
      </div>
    </header>

    <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

    <div class="actions-bar">
      <a href="/admin/products/create" class="btn-primary">+ Добавить товар</a>
    </div>

    <table class="data-table">
      <thead>
      <tr>
        <th>ID</th>
        <th>Название</th>
        <th>Категория</th>
        <th>Цена</th>
        <th>Ед. изм.</th>
        <th>Действия</th>
      </tr>
      </thead>
      <tbody>
      <tr th:each="product : ${products}">
        <td th:text="${product.id}"></td>
        <td th:text="${product.name}"></td>
        <td th:text="${product.categoryName}"></td>
        <td th:text="${product.price} + ' руб.'"></td>
        <td th:text="${product.unit}"></td>
        <td class="actions">
          <a th:href="@{/admin/products/edit/{id}(id=${product.id})}"
             class="btn-edit">Изменить</a>
          <a th:href="@{/admin/products/stock/{productId}(productId=${product.id})}"
             class="btn-stock">Остатки</a>
          <form th:action="@{/admin/products/delete/{id}(id=${product.id})}"
                method="post"
                style="display: inline;">
            <button type="submit" class="btn-danger"
                    onclick="return confirm('Удалить товар?')">Удалить</button>
          </form>
        </td>
      </tr>
      </tbody>
    </table>
  </div>
</th:block>
</body>
</html>
