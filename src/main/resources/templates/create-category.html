<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Добавить категорию</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<th:block th:if="${employee != null}">
  <div class="container">
    <header>
      <h1>Добавить категорию</h1>
      <div class="user-info">
        <span th:text="${employee.name}"></span>
        <a href="/categories" class="back-btn">← Назад</a>
      </div>
    </header>

    <div class="form-container">
      <form th:action="@{/categories/create}" method="post">
        <div class="form-group">
          <label>Название категории:</label>
          <input type="text" name="name" required placeholder="Молочные продукты">
        </div>

        <button type="submit" class="btn-primary">Добавить</button>
      </form>
    </div>
  </div>
</th:block>
</body>
</html>
