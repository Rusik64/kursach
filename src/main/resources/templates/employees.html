<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Управление сотрудниками</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<th:block th:if="${employee != null}">
    <div class="container">
        <header>
            <h1>Управление сотрудниками</h1>
            <div class="user-info">
                <span th:text="${employee.name}"></span>
                <a href="/" class="back-btn">На главную</a>
            </div>
        </header>

        <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
        <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

        <div class="actions-bar">
            <a href="/employees/create" class="btn-primary">+ Добавить сотрудника</a>
        </div>

        <table class="data-table">
            <thead>
            <tr>
                <th>ID</th>
                <th>Имя</th>
                <th>Магазин</th>
                <th>Логин</th>
                <th>Роль</th>
                <th>Действия</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="emp : ${employees}"
                th:class="${emp.id == currentUserId} ? 'current-user' : ''">
                <td>
                    <span th:text="${emp.id}"></span>
                    <span th:if="${emp.id == currentUserId}" class="badge badge-you">Вы</span>
                </td>
                <td th:text="${emp.name}"></td>
                <td th:text="${emp.shopId}"></td>
                <td th:text="${emp.login}"></td>
                <td>
                            <span class="role-badge" th:class="'role-badge role-' + ${emp.role}"
                                  th:text="${emp.role}"></span>
                </td>
                <td class="actions">
                    <!-- Если это текущий пользователь - показываем предупреждение -->
                    <th:block th:if="${emp.id == currentUserId}">
                                <span class="text-muted" title="Нельзя изменить свою учетную запись">
                                    Текущий пользователь
                                </span>
                    </th:block>

                    <!-- Если это другой пользователь - показываем действия -->
                    <th:block th:unless="${emp.id == currentUserId}">
                        <a th:href="@{/employees/edit/{id}(id=${emp.id})}"
                           class="btn-edit">Изменить</a>

                        <form th:action="@{/employees/update-role}"
                              method="post"
                              style="display: inline;">
                            <input type="hidden" name="employeeId" th:value="${emp.id}">
                            <select name="newRole" onchange="this.form.submit()" class="role-select">
                                <option value="CASHIER" th:selected="${emp.role == 'CASHIER'}">Кассир</option>
                                <option value="MANAGER" th:selected="${emp.role == 'MANAGER'}">Менеджер</option>
                                <option value="ADMIN" th:selected="${emp.role == 'ADMIN'}">Админ</option>
                            </select>
                        </form>

                        <form th:action="@{/employees/delete/{id}(id=${emp.id})}"
                              method="post"
                              style="display: inline;"
                              onsubmit="return confirm('Удалить сотрудника?')">
                            <button type="submit" class="btn-danger">Удалить</button>
                        </form>
                    </th:block>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</th:block>
</body>
</html>
